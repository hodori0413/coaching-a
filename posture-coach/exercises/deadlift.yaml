# 데드리프트 — 원본: yakupzengin/fitness-trainer-pose-estimation exercises/definitions/deadlift.yaml (MIT)
# 원본의 각도·상태 기준값은 유지. 바꾼 점:
#  - rest_state: up (선 자세에서 시작)
#  - rounded_back: 실제로는 고관절 각도만 봄(허리 굽음은 알 수 없음) → 메시지를 실제 의미에 맞게
#  - 메시지/이름 한국어화, view(촬영 방향) 추가

name: deadlift
display_name: 데드리프트
type: repetition
view: side
description: 옆에서 찍어주세요
target_muscles:
- Hamstrings
- Glutes
- Lower Back
equipment: Bodyweight or Barbell
difficulty: intermediate
default_reps: 8
default_sets: 3
angles:
  primary:
    points:
    - left_shoulder
    - left_hip
    - left_knee
    description: Kalça menteşe açısı
state_order:
- up
- hinge
- down
states:
  up:
    condition: angle > 165
  hinge:
    condition: angle > 100 and angle <= 165
  down:
    condition: angle <= 100
rest_state: up
counter:
  trigger_state: up
  from_state: down
min_rep_duration: 1.0
feedback:
  rounded_back:
    condition: angle < 90
    message: 상체를 너무 깊이 숙였어요. 엉덩이를 뒤로 빼세요
    severity: warning
visualization:
  lines:
  - points:
    - left_shoulder
    - left_hip
    color:
    - 139
    - 69
    - 19
    thickness: 4
  - points:
    - left_hip
    - left_knee
    color:
    - 139
    - 69
    - 19
    thickness: 4
