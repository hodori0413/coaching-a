# 카프 레이즈 — 원본: yakupzengin/fitness-trainer-pose-estimation exercises/definitions/calf_raise.yaml (MIT)
# 원본의 각도·상태 기준값은 유지. 바꾼 점:
#  - [설계 오류] 원본은 무릎 각도로 횟수를 세서 '무릎을 굽힐 때' 세짐 (자기 경고 규칙과도 모순)
#  - → 뒤꿈치가 발끝보다 올라간 높이(몸통 길이 기준 단위)로 상태 판단. 8/20은 임시값
#  - 메시지/이름 한국어화, view(촬영 방향) 추가

name: calf_raise
display_name: 카프 레이즈
type: repetition
view: side
description: 옆에서 찍어주세요
target_muscles:
- Calves
- Soleus
equipment: Bodyweight
difficulty: beginner
default_reps: 15
default_sets: 3
angles:
  primary:
    points:
    - left_hip
    - left_knee
    - left_ankle
    description: Bacak açısı
state_order:
- up
- raise
- down
states:
  down:
    condition: left_foot_index_y - left_heel_y < 8
  raise:
    condition: left_foot_index_y - left_heel_y >= 8 and left_foot_index_y - left_heel_y < 20
  up:
    condition: left_foot_index_y - left_heel_y >= 20
counter:
  trigger_state: up
  from_state: raise
min_rep_duration: 0.5
feedback:
  bent_knees:
    condition: angle < 150
    message: 무릎을 펴세요
    severity: warning
visualization:
  lines:
  - points:
    - left_knee
    - left_ankle
    color:
    - 0
    - 255
    - 255
    thickness: 4
